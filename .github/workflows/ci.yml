name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Non-blocking: registry audit endpoint is flaky (503s); results stay visible in logs
      - run: npm audit --audit-level=high
        continue-on-error: true
