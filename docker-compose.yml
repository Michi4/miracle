services:
  miracle:
    build: .
    restart: unless-stopped
    container_name: miracle
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_NAME}.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_NAME}.entrypoints=http"
      - "traefik.http.middlewares.${ROUTER_NAME}-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${ROUTER_NAME}.middlewares=${ROUTER_NAME}-redirect"
      - "traefik.http.routers.${ROUTER_NAME}-secure.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_NAME}-secure.entrypoints=https"
      - "traefik.http.routers.${ROUTER_NAME}-secure.tls=true"
      - "traefik.http.routers.${ROUTER_NAME}-secure.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.${ROUTER_NAME}-limit.ratelimit.average=100"
      - "traefik.http.middlewares.${ROUTER_NAME}-limit.ratelimit.burst=200"
      - "traefik.http.routers.${ROUTER_NAME}-secure.middlewares=${ROUTER_NAME}-limit"
    networks:
      - traefik

  miracle-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    container_name: miracle-api
    env_file:
      - .env
      - .env.secrets
    environment:
      - PORT=3000
      - DB_PATH=/data/miracle.json
    volumes:
      - miracle-data:/data
    networks:
      - traefik

volumes:
  miracle-data:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
