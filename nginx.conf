server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # proxy Instagram CDN to avoid CORP blocking (images only, GET/HEAD only)
    location ~ ^/ig/(.*) {
        limit_except GET HEAD { deny all; }
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://scontent-vie1-1.cdninstagram.com/$1$is_args$args;
        proxy_set_header Referer https://www.instagram.com/;
        proxy_set_header User-Agent "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1";
        proxy_set_header Accept "image/avif,image/webp,*/*";
        proxy_ssl_server_name on;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ ^/unsplash/(.*) {
        limit_except GET HEAD { deny all; }
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://images.unsplash.com/$1$is_args$args;
        proxy_set_header Referer https://miracle.websters.at/;
        proxy_ssl_server_name on;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Access-Control-Allow-Origin "*" always;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /site.webmanifest {
        add_header Content-Type "application/manifest+json";
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
