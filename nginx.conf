server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # proxy Instagram CDN to avoid CORP blocking (images only, GET/HEAD only).
    # /ig/<cdn-host>/<path> - host strictly allowlisted by regex (first match wins), NOT an open proxy.
    location ~ ^/ig/(?<ighost>[A-Za-z0-9-]+\.cdninstagram\.com)/(?<igpath>.+) {
        limit_except GET HEAD { deny all; }
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://$ighost/$igpath$is_args$args;
        proxy_set_header Referer https://www.instagram.com/;
        proxy_set_header User-Agent "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1";
        proxy_set_header Accept "image/avif,image/webp,*/*";
        proxy_ssl_server_name on;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location ~ ^/ig/ { return 400; }
    # backend API (gigs, live IG data, admin) - same origin, no CORS needed
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream miracle-api:3000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
    location ~ ^/unsplash/(.*) {
        limit_except GET HEAD { deny all; }
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://images.unsplash.com/$1$is_args$args;
        proxy_set_header Referer https://miracle.websters.at/;
        proxy_ssl_server_name on;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Access-Control-Allow-Origin "*" always;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    # SPA shell must never be stale-cached (hashed assets below are immutable)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /site.webmanifest {
        add_header Content-Type "application/manifest+json";
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
